    <script>
        try {
            const firebaseConfig = {
              apiKey: "AIzaSyDxt2CaqI7AUVL9AQ_DhwrThXLUUQtbqII",
              authDomain: "my-ai-skincare.firebaseapp.com",
              projectId: "my-ai-skincare",
              storageBucket: "my-ai-skincare.firebasestorage.app",
              messagingSenderId: "684962829401",
              appId: "1:684962829401:web:0e2b7371c23c4d9a3b4d48"
            };
            firebase.initializeApp(firebaseConfig);
            window.fbAuth = firebase.auth();
            window.fbDb = firebase.firestore();

            // [v7] 네트워크 전송 강화 — WebSocket이 막힌 환경(모바일 캐리어/공용WiFi/일부 브라우저)에서
            // 자동으로 HTTPS long-polling으로 폴백. "Could not reach Cloud Firestore backend" 에러 방지.
            // ★ settings()는 반드시 어떤 Firestore 호출보다도 먼저 호출되어야 함.
            try {
                window.fbDb.settings({
                    experimentalAutoDetectLongPolling: true,
                    merge: true
                });
            } catch (settingsErr) {
                console.warn("Firestore settings 적용 실패 (이미 Firestore 호출됨):", settingsErr);
            }

            // [v7] 오프라인 캐시 활성화 — 이전에 읽어둔 내 데이터를 IndexedDB에 보관해서
            // 네트워크가 잠시 끊겨도 읽기 전용으로 계속 동작. 자동 저장은 onlineGuard로 별도 차단.
            window.fbDb.enablePersistence({ synchronizeTabs: true })
                .catch(err => {
                    if (err.code === 'failed-precondition') {
                        console.warn("오프라인 캐시: 다른 탭이 이미 열려있어 비활성화 (정상)");
                    } else if (err.code === 'unimplemented') {
                        console.warn("오프라인 캐시: 이 브라우저는 IndexedDB 미지원");
                    } else {
                        console.warn("오프라인 캐시 활성화 실패:", err);
                    }
                });

            window.fbSignIn = () => window.fbAuth.signInWithPopup(new firebase.auth.GoogleAuthProvider());
            window.fbSignOut = () => window.fbAuth.signOut();
        } catch (e) {
            console.error("Firebase 초기화 에러:", e);
        }
    </script>

        const Pencil = ({ className }) => <Icon name="pen-to-square" className={className} />;
        // [v8] 휴지통 '열기' 버튼용 — 일반 삭제(Trash2)와 시각적으로 구별
        const TrashOpen = ({ className }) => <Icon name="trash-can-arrow-up" className={className} />;

        const ingredientDict = {
          'aha': { name: 'AHA (알파하이드록시산)', desc: '피부 최외곽의 묵은 각질을 녹여 피부결을 매끄럽게 하고 턴오버를 돕습니다. 단, 자외선에 취약해지므로 밤에만 사용해야 합니다.', type: 'caution' },
          'bha': { name: 'BHA (살리실산)', desc: '지용성 각질 제거 성분으로, 모공 속 피지와 블랙헤드를 녹이는 데 탁월합니다. 건조함을 유발할 수 있습니다.', type: 'caution' },
          'alcohol': { name: '알코올/에탄올', desc: '제품의 흡수력을 높이고 청량감을 주지만, 수분을 증발시켜 건조함을 유발하거나 면도 상처에 자극이 될 수 있습니다.', type: 'caution' },
          'fragrance': { name: '향료 (Fragrance)', desc: '화장품에 향을 부여합니다. 인공 향료는 민감성 피부나 알레르기 피부에 트러블을 유발할 가능성이 있어 주의가 필요합니다.', type: 'caution' },
          'silicone': { name: '실리콘 (Silicone)', desc: '피부에 매끄러운 막을 형성해 발림성을 좋게 하지만, 모공을 막아 수부지/지성 피부에 트러블을 유발할 수 있습니다.', type: 'caution' },
          'shea butter': { name: '시어버터', desc: '강력한 천연 보습막을 형성하는 초고영양 성분입니다. 건성에게는 최고이나 지성에게는 모공을 막아 여드름을 유발할 수 있습니다.', type: 'caution' },
          'liposome': { name: '리포솜 (Liposome)', desc: '피부 세포막과 유사한 구조의 미세 캡슐로, 유효 성분을 피부 진피층까지 안전하고 깊숙하게 전달하는 고급 흡수 기술입니다.', type: 'pro' },
          'ceramide': { name: '세라마이드', desc: '피부 지질의 50% 이상을 차지하는 핵심 성분으로, 무너진 피부 장벽을 시멘트처럼 메워 수분 증발을 막습니다.', type: 'pro' },
          'hyaluronic acid': { name: '히알루론산', desc: '자기 무게의 1000배에 달하는 수분을 끌어당기는 수분 자석입니다. 번들거림 없이 속건조 해결에 탁월합니다.', type: 'pro' },
          'panthenol': { name: '판테놀 (Vitamin B5)', desc: '피부에 흡수되면 비타민 B5로 변환되어 즉각적인 진정 효과와 함께 강력한 수분 보습막을 형성합니다.', type: 'pro' },
          'cica': { name: '시카 (병풀 추출물)', desc: '호랑이풀로 불리며, 상처 입고 자극받은 피부(면도 트러블 등)를 진정시키고 장벽을 회복하는 데 매우 탁월합니다.', type: 'pro' },
          'exosome': { name: '엑소좀', desc: '세포 간 신호를 전달하는 나노 소포체로, 손상된 피부 세포의 근본적인 자생력을 높이는 최첨단 줄기세포 배양 기술입니다.', type: 'pro' },
          'resveratrol': { name: '레스베라트롤', desc: '포도 등에 함유된 강력한 항산화 성분입니다. 칙칙한 안색을 맑게 개선하지만 빛/열에 취약해 밤에 주로 사용합니다.', type: 'pro' },
          'caviar': { name: '캐비아 추출물', desc: '해양성 단백질과 아미노산이 풍부하여 늘어진 피부의 밀도와 탄력을 코르셋처럼 강력하게 끌어올려 줍니다.', type: 'pro' },
          'peptides': { name: '펩타이드', desc: '단백질 조각 성분으로, 피부 속 콜라겐 생성을 촉진하여 주름을 개선하고 쫀쫀한 탄력을 부여합니다.', type: 'pro' },
          'niacinamide': { name: '나이아신아마이드', desc: '식약처 고시 미백 성분으로 멜라닌 이동을 억제하여 톤을 밝혀주고 피지 조절 기능도 갖추고 있습니다.', type: 'pro' },
          'retinol': { name: '레티놀', desc: '주름 개선과 턴오버 촉진에 탁월한 비타민A 유도체입니다. 빛에 취약해 밤에만 바르며 초기 적응기가 필요합니다.', type: 'caution' },
          'cooling': { name: '쿨링 에이전트', desc: '피부에 닿는 즉시 열감을 내려 홍조를 완화하고 모공을 타이트하게 조여주는 작용을 합니다.', type: 'pro' },
          'softening': { name: '유연화 (Softening)', desc: '거칠어진 각질층을 스펀지처럼 말랑하게 풀어주어 다음 단계 유효성분의 흡수력을 폭발적으로 높여줍니다.', type: 'pro' },
          'repair': { name: '리페어/재생 (Repair)', desc: '피부 본연의 자생력을 높여 손상된 장벽을 회복시킵니다.', type: 'pro' },
          'antiaging': { name: '안티에이징 (Antiaging)', desc: '주름 개선 및 탄력 강화에 도움을 주는 고영양 성분입니다.', type: 'pro' }
        };

        const getIngredientDetails = (ing, type) => {
            const key = ing.toLowerCase();
            for (const dictKey in ingredientDict) {
               if (key.includes(dictKey)) return ingredientDict[dictKey];
            }
            return {
               name: ing,
               desc: type === 'pro' ? '해당 제품의 핵심 효능을 담당하는 유효 성분/기능입니다.' : '개인의 피부 상태나 사용 방법에 따라 자극이 될 수 있으니 주의가 필요한 성분입니다.',
               type: type
            };
        };

        // [수정] 신규 사용자를 위해 초기 데이터를 완전히 비웁니다.
        const initialInventory = [];

        const getTodayDateString = () => {
          const tzOffset = new Date().getTimezoneOffset() * 60000;
          return new Date(Date.now() - tzOffset).toISOString().split('T')[0];
        };

        // [수정] 신규 사용자를 위해 초기 기록을 완전히 비웁니다.
        const mockHistory = [];

        function App() {
          const [user, setUser] = useState(null);
          const [isLoadingDb, setIsLoadingDb] = useState(true);
          const [activeTab, setActiveTab] = useState('simulator');
          
          const [inventory, setInventory] = useState(initialInventory);
          const [userProfile, setUserProfile] = useState({ nickname: '마스터', gender: '남성', age: 40, skinType: '수부지', apiKey: '' });
          const [history, setHistory] = useState(mockHistory);
          const [conditionHistory, setConditionHistory] = useState([]); // 초기 컨디션 기록도 비움
          const [currentCondition, setCurrentCondition] = useState('건조함');
          const [conditionDate, setConditionDate] = useState(getTodayDateString());
          const [learnedIngredients, setLearnedIngredients] = useState({});

          useEffect(() => {
              if (!window.fbAuth) {
                  console.error("Firebase Auth가 없습니다.");
                  setIsLoadingDb(false);
                  return;
              }

              const unsub = window.fbAuth.onAuthStateChanged(async (currentUser) => {
                  // [v5] 데이터 로딩 시작 플래그 설정 — 로딩 중엔 자동 저장 차단됨
                  setIsLoadingDb(true);
                  setUser(currentUser);
                  try {
                      if (currentUser) {
                          const docRef = window.fbDb.collection('users').doc(currentUser.uid);
                          const snap = await docRef.get();
                          if (snap.exists) {
                              const data = snap.data();
                              // [v5] 인벤토리 마이그레이션 — 구형 step(0~5) → 신형 step(1~7)
                              // 멱등성(idempotent) 보장: v5로 이미 변환된 데이터는 재변환하지 않음
                              if(data.inventory) {
                                const raw = data.inventory;
                                // 레거시 판별: 레거시 고유 시그니처가 하나라도 있으면 레거시로 간주
                                const isLegacy = raw.some(it =>
                                  it.step === 0 ||
                                  (it.step === 3 && it.isEyeCare) ||
                                  (it.step === 4 && ['eyecream','suncream','general'].includes(it.subCategory))
                                );
                                // v5 확정 시그니처: step 7이 이미 존재
                                const hasV5Pack = raw.some(it => it.step === 7);

                                let migrated;
                                if (isLegacy && !hasV5Pack) {
                                  migrated = raw.map(it => {
                                    const legacyStep = it.step;
                                    // 아이크림 레거시 플래그 (v1~v2): step:3 + isEyeCare → step:5
                                    if (legacyStep === 3 && it.isEyeCare) {
                                      const { isEyeCare, subCategory, ...rest } = it;
                                      return { ...rest, step: 5 };
                                    }
                                    // v3~v4 Step 4 서브카테고리 변환
                                    if (legacyStep === 4 && it.subCategory === 'eyecream') {
                                      const { subCategory, isEyeCare, ...rest } = it;
                                      return { ...rest, step: 5 };
                                    }
                                    if (legacyStep === 4 && (it.subCategory === 'suncream' || it.subCategory === 'general')) {
                                      const { isEyeCare, ...rest } = it;
                                      return { ...rest, step: 6, subCategory: it.subCategory };
                                    }
                                    // 구형 step 5(팩) → 신형 step 7
                                    if (legacyStep === 5) {
                                      const { subCategory, isEyeCare, ...rest } = it;
                                      return { ...rest, step: 7 };
                                    }
                                    // 구형 step 0,1,2,3 → 신형 1,2,3,4 (+1)
                                    if (typeof legacyStep === 'number' && legacyStep <= 3) {
                                      const { subCategory, isEyeCare, ...rest } = it;
                                      return { ...rest, step: legacyStep + 1 };
                                    }
                                    return it;
                                  });
                                } else {
                                  // 이미 v5 — subCategory 기본값만 보정
                                  migrated = raw.map(it => {
                                    if (it.step === 6 && !it.subCategory) return { ...it, subCategory: 'general' };
                                    return it;
                                  });
                                }
                                // [v6→v7] packType 재편 마이그레이션
                                // v6: sheet→mask, washoff→exfoliate (sleeping/modeling 유지)
                                // v7: modeling → mask 통합 (3종 체계 확정: exfoliate/sleeping/mask)
                                // 멱등성: 이미 새 키로 변환된 데이터는 건드리지 않음
                                migrated = migrated.map(it => {
                                  if (it.step !== 7 || !it.packType) return it;
                                  if (it.packType === 'sheet')    return { ...it, packType: 'mask' };     // 레거시 시트팩
                                  if (it.packType === 'washoff')  return { ...it, packType: 'exfoliate' }; // 레거시 워시오프
                                  if (it.packType === 'modeling') return { ...it, packType: 'mask' };     // [v7] 모델링팩 → 마스크팩 통합
                                  return it;
                                });
                                setInventory(migrated);
                              } else {
                                setInventory([]);
                              }

                              // [v5] 최종 백업일 로드
                              if(data.lastBackupAt) setLastBackupAt(data.lastBackupAt);

                              // [v6] 휴지통 로드 + 7일 경과 자동 삭제
                              if(data.trash && Array.isArray(data.trash)) {
                                const now = Date.now();
                                const WEEK = 7 * 24 * 60 * 60 * 1000;
                                const kept = data.trash.filter(t => {
                                  if (!t.deletedAt) return false;
                                  return (now - new Date(t.deletedAt).getTime()) < WEEK;
                                });
                                setTrash(kept);
                              } else {
                                setTrash([]);
                              }
                              // [v8] 루틴 기록 휴지통 로드 + 7일 경과 자동 삭제
                              if(data.historyTrash && Array.isArray(data.historyTrash)) {
                                const now = Date.now();
                                const WEEK = 7 * 24 * 60 * 60 * 1000;
                                const kept = data.historyTrash.filter(t => {
                                  if (!t.deletedAt) return false;
                                  return (now - new Date(t.deletedAt).getTime()) < WEEK;
                                });
                                setHistoryTrash(kept);
                              } else {
                                setHistoryTrash([]);
                              }
                              // [v5] userProfile이 DB에 있으면 반드시 세팅, 없어도 빈 값으로 덮어쓰지 않음
                              if(data.userProfile) setUserProfile(data.userProfile);
                              // [v7] 메커니즘 리포트 7일 자동 만료 — 루틴 기록 자체는 유지, 리포트만 삭제
                              if(data.history) {
                                const nowTs = Date.now();
                                const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
                                const pruned = data.history.map(h => {

                } else if (pp.packType === 'mask' || hasAnyIng(pp, ['cica', 'panthenol', 'centella'])) {
                  addMsg(7, 'pro', `★ [${pp.name}] 진정·보습 마스크팩은 피부 안정화에 탁월합니다. 15분 이내에 떼어내세요.`);
                  score += 5;
                }
              });
            }

            if (score > 100) score = 100;
            if (score < 0) score = 0;
            let grade = score >= 90 ? '최고의 궁합 🏆' : score >= 70 ? '좋은 루틴 👍' : score >= 50 ? '주의 필요 ⚠️' : '재설계 시급 🚨';
            return { score, grade, stepFeedback, selectedProducts };
          };

          // [v3] 메인 시뮬레이터 분석 (메모이제이션)
          const analysis = useMemo(
            () => computeAnalysis(routine, timeOfDay),
            [routine, timeOfDay, inventory, userProfile, currentCondition, learnedIngredients]
          );

          // [v3] 편집 모달용 실시간 분석 (메모이제이션)
          const editAnalysis = useMemo(
            () => editHistoryId ? computeAnalysis(editRoutine, editTimeOfDay) : null,
            [editHistoryId, editRoutine, editTimeOfDay, inventory, userProfile, currentCondition, learnedIngredients]
          );

          const handleImageUpload = (e) => {
            const file = e.target.files[0];
            if (file) {
              // Gemini가 허용하는 이미지 타입: jpeg, png, webp, heic, heif
              const allowed = ['image/jpeg', 'image/png', 'image/webp', 'image/heic', 'image/heif'];
              const mime = allowed.includes(file.type) ? file.type : 'image/jpeg';
              setAiImageMime(mime);
              const reader = new FileReader();
              reader.onloadend = () => setAiImageBase64(reader.result.split(',')[1]);
              reader.readAsDataURL(file);
            }
          };

          const getActiveApiKey = () => {
            if (userProfile.apiKey) {
                // 앞뒤 공백/개행만 제거. Google API 키 형식을 훼손하지 않음.
                return userProfile.apiKey.trim();
            }
            return ""; 
          };

          const callGeminiApiWithFallback = async (payload, key) => {
              if (!key || key.length < 20) {
                 throw new Error("API 키를 확인해주세요.");
              }

              const hasImage = payload.contents[0].parts.some(p => p.inlineData);
              // [v7] 폴백 풀 — 2.5 계열이 과부하/한도 초과일 때 2.0 계열로 자동 폴백.
              // 2.0 Flash / 2.0 Flash-Lite는 2.5와 별도 쿼터 풀이라 동시 다운될 확률이 낮음.
              // 주의: Gemini 1.5 계열(pro/flash/flash-8b)은 2025년 9월 퇴출되어 호출 불가.
              // 이미지: 멀티모달 성능 좋은 pro 우선 / 텍스트: 속도·한도 넉넉한 flash 우선.
              const modelsToTry = hasImage
                  ? ['gemini-2.5-pro', 'gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.0-flash', 'gemini-2.0-flash-lite']
                  : ['gemini-2.5-flash', 'gemini-2.5-flash-lite', 'gemini-2.5-pro', 'gemini-2.0-flash', 'gemini-2.0-flash-lite'];

              // [v7] 재시도용 유틸 — 지수 백오프. 503/429/500/502/504 같은 일시적 에러에 적용.
              const sleep = (ms) => new Promise(r => setTimeout(r, ms));
              const isTransient = (status) => status === 429 || status === 500 || status === 502 || status === 503 || status === 504;

              let errorLogs = [];
              let lastTransientStatus = null;

              for (const model of modelsToTry) {
                  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`;

                  // 같은 모델에 최대 2회 재시도 (초회 포함 총 2번)
                  // 429(Rate Limit)는 백오프 더 길게, 503/500 등은 짧게
                  for (let attempt = 0; attempt < 2; attempt++) {
                      try {
                          const res = await fetch(url, {
                              method: 'POST',
                              headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify(payload)
                          });

                          const responseText = await res.text();

                          if (res.ok) {
                              const data = JSON.parse(responseText);
                              return data.candidates?.[0]?.content?.parts?.[0]?.text || "";
                          }

                          errorLogs.push(`[${model}] 시도${attempt + 1} ➔ ❌ ${res.status}`);

                          // API 키 자체가 문제 → 더 이상 시도 무의미
                          if (res.status === 400 && responseText.includes("API_KEY_INVALID")) {
                              throw new Error("⚠️ 발급하신 API 키가 유효하지 않습니다.\n\n구글 AI Studio로 이동하여 파란색 [Create API key in new project] 버튼을 눌러 아예 새로운 키를 발급받아보세요!");
                          }

                          // 일시 에러면 백오프 후 재시도 (같은 모델)
                          if (isTransient(res.status)) {
                              lastTransientStatus = res.status;
                              if (attempt === 0) {
                                  // 429는 RPM 제한이라 좀 더 길게, 503/500은 짧게
                                  const backoffMs = res.status === 429 ? 2500 : 800;
                                  await sleep(backoffMs);
                                  continue; // 같은 모델로 재시도
                              }
                              break; // 두 번 시도해도 실패 → 다음 모델로
                          }

                          // 일시 에러가 아닌데 실패 → 다음 모델로
                          break;
                      } catch (err) {
                          if (err.message && err.message.includes("유효하지 않습니다")) throw err;
                          errorLogs.push(`[${model}] 시도${attempt + 1} ➔ 오류: ${err.message}`);
                          break; // 네트워크 예외는 재시도해도 대부분 같음 → 다음 모델로
                      }
                  }
              }

              // [v7] 상태별 사용자 친화 메시지 — API 키 탓으로 오해 안 하게
              let hint;
              if (lastTransientStatus === 429) {
                  hint = "⏳ 구글 AI의 분당 요청 한도에 걸렸습니다.\n\n무료 등급 Gemini 2.5 Pro는 분당 2회, 하루 50회 한도입니다.\n\n• 30초~1분 정도 기다린 뒤 다시 시도해주세요\n• 혹은 Google AI Studio에서 결제 카드를 등록하면 한도가 대폭 상향됩니다";
              } else if (lastTransientStatus === 503 || lastTransientStatus === 500 || lastTransientStatus === 502 || lastTransientStatus === 504) {
                  hint = "🌐 구글 AI 서버가 일시적으로 과부하 상태입니다 (사용자 잘못 아님).\n\n• 잠시 후 다시 시도해주세요 (보통 1~3분 내 회복)\n• 피크 시간(오전/저녁)에 자주 발생합니다";
              } else {
                  hint = "구글 서버에 연결할 수 없습니다.\n\nAI Studio에서 [Create API key in new project]로 새 키를 받으시면 해결될 수 있습니다.";

          const extractJsonFromText = (text) => {

          const handleAiAnalyze = async () => {

            const payload = {

            try {

          const confirmAiRegistration = () => {

              setInventory([sanitized, ...inventory]);
              const targetName = sanitized.brand || sanitized.name || aiInput || '선택한 제품';

              // [v7] Quick 모달에서 등록한 경우 → 현재 picker의 step과 일치하면 자동 선택 + 모달 닫기

                const merged = {

            setHistoryTrash(prev => prev.filter(t => t.id !== id));
          };

          // 5) 루틴 기록 휴지통 비우기
          const emptyHistoryTrash = () => {
            if (historyTrash.length === 0) return;
            if (!window.confirm(`루틴 기록 휴지통의 ${historyTrash.length}개를 모두 영구 삭제합니다. 계속하시겠습니까?`)) return;
            setHistoryTrash([]);
          };

          // [v3] 저장된 루틴 기록 편집 핸들러
          const openEditHistory = (h) => {
            const r = normalizeRoutine(h.routine);
            setEditHistoryId(h.id);
            setEditRoutine(r);
            setEditDate(h.date);
            setEditTimeOfDay(h.timeOfDay || 'night');
          };

          const closeEditHistory = () => {
            setEditHistoryId(null);
            setEditPickerStep(null);
            setEditPickerSearch('');
          };

          const handleEditToggleProduct = (step, id) => {
            setEditRoutine(prev => {
              const arr = prev[step] || [];
              if (arr.includes(id)) return { ...prev, [step]: arr.filter(x => x !== id) };
              return { ...prev, [step]: [...arr, id] };
            });
          };

          const handleEditMoveProduct = (step, id, direction) => {
            setEditRoutine(prev => {
              const arr = [...(prev[step] || [])];
              const idx = arr.indexOf(id);
              if (idx < 0) return prev;
              const swapIdx = direction === 'up' ? idx - 1 : idx + 1;
              if (swapIdx < 0 || swapIdx >= arr.length) return prev;
              [arr[idx], arr[swapIdx]] = [arr[swapIdx], arr[idx]];
              return { ...prev, [step]: arr };
            });
          };

          const handleEditRemoveProduct = (step, id) => {
            setEditRoutine(prev => ({ ...prev, [step]: (prev[step] || []).filter(x => x !== id) }));
          };

          const saveEditHistory = () => {
            if (!editHistoryId) return;
            const hasAny = [0,1,2,3,4,5].some(s => (editRoutine[s] || []).length > 0);
            if (!hasAny) {
              alert('최소 1개 이상의 제품을 선택해야 합니다.');
              return;
            }
            const newScore = editAnalysis ? editAnalysis.score : 0;
            setHistory(prev => prev.map(h => {
              if (h.id !== editHistoryId) return h;
              return {
                ...h,
                date: editDate,
                timeOfDay: editTimeOfDay,
                routine: { ...editRoutine },
                score: newScore
              };
            }).sort((a, b) => new Date(b.date) - new Date(a.date)));
            closeEditHistory();
            alert(`루틴 기록이 수정되었습니다. (새 점수: ${newScore}점)`);
          };

          // [v8] AI 추천 루틴 — 사용자 인벤토리에서 목표별 시그니처 성분으로 매칭
          // 기존 구현은 시드 ID('1','2'...)를 하드코딩해서 시드를 지운 계정에서 동작하지 않았음
          const applyRecommendation = () => {
            // 인벤토리 도우미
            const ingsOf = (item) => [...(item.keyIngredients || []), ...(item.cautionIngredients || [])]
              .map(x => (x || '').toLowerCase());
            const hasAny = (item, kws) => {
              const ings = ingsOf(item);
              return kws.some(k => ings.some(i => i.includes(k.toLowerCase())));
            };
            // step 내에서 predicate에 가장 잘 맞는 1개 (없으면 undefined)
            const pickOne = (step, predicate) => {
              const list = inventory.filter(i => i.step === step);
              const matched = list.find(predicate);
              return matched ? matched.id : null;
            };
            // step 내에서 predicate에 맞는 N개 (최대 limit)
            const pickMany = (step, predicate, limit) => {
              return inventory.filter(i => i.step === step && predicate(i))
                              .slice(0, limit)
                              .map(i => i.id);
            };

            // 목표별 매칭 규칙
            const rec = { 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] };
            let timeMode = 'night';

            if (goal === 'repair') {
              // 장벽 복구/진정 — cica/centella/panthenol/ceramide 시그니처
              const pred = (i) => hasAny(i, ['cica', 'centella', 'panthenol', 'ceramide', 'repair']);
              const id3 = pickOne(3, pred);                                   if (id3) rec[3] = [id3];
              const id4 = pickOne(4, pred);                                   if (id4) rec[4] = [id4];
              const id6 = pickOne(6, i => pred(i) && i.subCategory !== 'suncream')
                       || pickOne(6, i => i.subCategory !== 'suncream');     if (id6) rec[6] = [id6];
              timeMode = 'night';
            } else if (goal === 'pore') {
              // 모공/각질 — AHA/BHA/glycolic/niacinamide
              const pred = (i) => hasAny(i, ['aha', 'bha', 'glycolic', 'salicylic', 'niacinamide']);
              const id3 = pickOne(3, pred);                                   if (id3) rec[3] = [id3];
              const id4 = pickOne(4, pred);                                   if (id4) rec[4] = [id4];
              const id6 = pickOne(6, i => i.subCategory !== 'suncream');     if (id6) rec[6] = [id6];
              timeMode = 'night';
            } else if (goal === 'antiaging') {
              // 안티에이징/탄력 — peptides/retinol/exosome/caviar/adenosine
              const pred = (i) => hasAny(i, ['peptide', 'retinol', 'exosome', 'caviar', 'adenosine', 'resveratrol', 'antiaging']);
              const id3 = pickOne(3, pred);                                   if (id3) rec[3] = [id3];
              // 안티에이징은 세럼 2개까지 권장 (앰플 + 세럼 조합)
              const ids4 = pickMany(4, pred, 2);                              if (ids4.length) rec[4] = ids4;
              const id6 = pickOne(6, i => pred(i) && i.subCategory !== 'suncream')
                       || pickOne(6, i => i.subCategory !== 'suncream');     if (id6) rec[6] = [id6];
              timeMode = 'night';
            } else if (goal === 'moisture') {
              // 산뜻한 수분결 (낮 루틴) — hyaluronic/glycerin/panthenol + 선크림
              const pred = (i) => hasAny(i, ['hyaluronic', 'glycerin', 'panthenol', 'moisture']);
              const id3 = pickOne(3, pred) || pickOne(3, () => true);        if (id3) rec[3] = [id3];
              const id4 = pickOne(4, pred);                                   if (id4) rec[4] = [id4];
              // 낮 루틴이므로 선크림 우선 매칭
              const id6 = pickOne(6, i => i.subCategory === 'suncream')
                       || pickOne(6, () => true);                             if (id6) rec[6] = [id6];
              timeMode = 'day';
            }

            // Step 2(미스트/퍼스트)는 대부분의 목표에서 어울림 — 보유 시 추가
            const id2 = pickOne(2, () => true);                              if (id2) rec[2] = [id2];

            // 채워진 단계 수 점검 → 인벤토리가 빈약하면 안내
            const filledSteps = [2, 3, 4, 6].filter(s => rec[s].length > 0).length;
            if (filledSteps === 0) {
              alert(
                '⚠️ 인벤토리에서 추천 가능한 제품을 찾지 못했습니다.\n\n' +
                '[인벤토리] 탭에서 토너/세럼/크림 등을 먼저 등록해주세요.\n' +
                '성분 정보가 풍부할수록 AI 추천이 정확해집니다 (AI 등록 권장).'
              );
              return;
            }

            setTimeOfDay(timeMode);
            setRoutine(rec);
            setActiveTab('simulator');

            if (filledSteps < 4) {
              // 너무 시끄럽지 않게 안내 — 부분 추천된 사실만 알림
              setTimeout(() => {
                alert(
                  `🤖 인벤토리에서 ${filledSteps}개 단계 제품을 자동 선택했습니다.\n` +
                  `부족한 단계는 시뮬레이터에서 직접 추가해주세요.`
                );
              }, 100);
            }
          };

          // [v5] routine 정규화 — 구형(0~5)도 자동 변환하여 항상 신형(1~7) 반환
          // 기존 체계: 0=클렌징, 1=미스트, 2=토너, 3=세럼, 4=크림(+아이+선), 5=팩
          // 신규 체계: 1=클렌징, 2=미스트, 3=토너, 4=세럼, 5=아이크림, 6=크림/선크림, 7=팩
          const normalizeRoutine = (r) => {
            const empty = () => ({ 1: [], 2: [], 3: [], 4: [], 5: [], 6: [], 7: [] });
            if (!r) return empty();
            const toArr = (v) => Array.isArray(v) ? v : (v ? [v] : []);

            // 이미 신형이면 그대로 (키 6 또는 7이 있으면 신형)
            if (r.hasOwnProperty('6') || r.hasOwnProperty('7')) {
              const out = empty();
              [1,2,3,4,5,6,7].forEach(s => { out[s] = toArr(r[s]); });
              return out;
            }

            // 구형(0~5) → 신형(1~7) 변환
            // routine[4]는 v3에서 '일반크림+아이크림+선크림' 통합이었음 → Step 6으로 이동
            //   (저장 시점엔 inventory 객체에서 subCategory로 구분되므로 루틴 위치는 Step 6 하나로 모음)
            const out = empty();
            out[1] = toArr(r[0]); // 0 → 1 (클렌징)
            out[2] = toArr(r[1]); // 1 → 2 (미스트/퍼스트)
            out[3] = toArr(r[2]); // 2 → 3 (토너/로션)
            out[4] = toArr(r[3]); // 3 → 4 (세럼/앰플)
            out[5] = []; // 신규 추가 스텝 (아이크림): 과거 기록엔 없음
            out[6] = toArr(r[4]); // 4 → 6 (크림/선크림)
            out[7] = toArr(r[5]); // 5 → 7 (팩)
            return out;
          };

          const getCumulativeFeedback = () => {
            const feedbacks = [];
            const recent = history.slice(0, 3);
            let aha = 0, res = 0;
            recent.forEach(h => {
              const r = normalizeRoutine(h.routine);
              // [v5] 세럼은 Step 4
              r[4].forEach(id => {
                const item = inventory.find(i => i.id === id);
                if (!item) return;
                const ings = (item.keyIngredients || []).map(x => x.toLowerCase());
                if (ings.some(i => i.includes('aha'))) aha++;
                if (ings.some(i => i.includes('resveratrol'))) res++;
              });
            });
            if (aha >= 2) feedbacks.push({ type: 'warning', text: `🚨 AHA 성분 과다 사용! ${userProfile.nickname}님의 피부 장벽이 무너질 수 있습니다. 당분간 진정시켜주세요.` });
            else if (aha === 1) feedbacks.push({ type: 'info', text: `💡 최근 AHA를 사용하셨네요. 오늘은 보습 케어를 추천합니다.` });
            if (res >= 2) feedbacks.push({ type: 'good', text: `✅ 레스베라트롤 연달아 사용 중: 훌륭합니다! 안티에이징 시너지가 폭발합니다.` });
            if (!feedbacks.length) feedbacks.push({ type: 'info', text: '무난하게 밸런스를 맞춰 스킨케어를 진행 중입니다.' });
            return feedbacks;
          };

          const getRoutineCareType = (routineObj) => {
            const r = normalizeRoutine(routineObj);
            // [v5] 1~7 전 스텝 순회
            const allIds = [...r[1], ...r[2], ...r[3], ...r[4], ...r[5], ...r[6], ...r[7]];
            const list = allIds.map(id => inventory.find(i => i.id === id)).filter(Boolean);
            const ings = list.flatMap(p => p?.keyIngredients || []).map(i => i.toLowerCase());
            if (ings.some(i => i.includes('aha') || i.includes('bha'))) return { label: '✨ 모공/각질', color: 'bg-indigo-100 text-indigo-700' };
            if (ings.some(i => i.includes('resveratrol') || i.includes('caviar') || i.includes('antiaging'))) return { label: '👑 안티에이징', color: 'bg-yellow-100 text-yellow-800' };
            if (ings.some(i => i.includes('cica') || i.includes('ceramide') || i.includes('repair') || i.includes('exosome'))) return { label: '🛡️ 장벽 복구', color: 'bg-green-100 text-green-700' };
            return { label: '💧 수분 보습', color: 'bg-blue-100 text-blue-700' };
          };

          const saveCondition = () => {
            const newEntry = { date: conditionDate, condition: currentCondition };
            const existingIdx = conditionHistory.findIndex(c => c.date === conditionDate);
            let newHistory = [...conditionHistory];
            if (existingIdx >= 0) newHistory[existingIdx] = newEntry;
            else newHistory.push(newEntry);
            
            newHistory.sort((a, b) => new Date(b.date) - new Date(a.date));
            setConditionHistory(newHistory);
            alert(`${conditionDate} 피부 컨디션이 [${currentCondition}] 상태로 기록되었습니다!`);
          };

          const filteredHistory = filterDate ? history.filter(h => h.date === filterDate) : history;

          // ============================================================
          // [v8] 모바일 뒤로가기 버튼 처리
          // - 모바일에서 뒤로가기 누르면 앱이 종료되던 문제 해결
          // - History API로 모달/탭 상태를 브라우저 히스토리에 미러링
          // - 모든 모달이 닫히고 simulator 탭일 때만 기본 종료 동작 유지
          // ============================================================

          // 단일 모달용 뒤로가기 훅
          // isOpen=true가 되면 sentinel을 pushState, 뒤로가기 시 onClose 호출
          // 프로그래밍 방식 close(X버튼) 시 history.back()으로 히스토리 동기화
          const useBackClose = (isOpen, onClose, tag) => {
            useEffect(() => {
              if (!isOpen) return;
              // 같은 tag 모달이 재오픈돼도 인스턴스를 구분할 수 있는 고유 ts
              const ts = Date.now() + Math.random();
              window.history.pushState({ __skmod: tag, __skts: ts }, '');

              const onPop = () => {
                // 우리 sentinel이 현재 state가 아니면 뒤로가기로 밀려난 것 → 모달 닫기
                const s = window.history.state;
                if (!s || s.__skts !== ts) {
                  try { onClose(); } catch (e) { console.error('[back]', tag, e); }
                }
              };
              window.addEventListener('popstate', onPop);

              return () => {
                window.removeEventListener('popstate', onPop);
                // 프로그래밍 방식 close(X 버튼 등): 아직 우리 sentinel이 최상위면 back()으로 제거
                const s = window.history.state;
                if (s && s.__skts === ts) {
                  window.history.back();
                }
              };
            }, [isOpen]);
          };

          // 각 모달에 뒤로가기 핸들러 등록 (순서 무관, 각자 독립 동작)
          useBackClose(isProfileModalOpen,       () => setIsProfileModalOpen(false),                                                 'profile');
          useBackClose(isSaveModalOpen,          () => setIsSaveModalOpen(false),                                                    'save');
          useBackClose(isTrashModalOpen,         () => setIsTrashModalOpen(false),                                                   'trash');
          useBackClose(!!selectedDetailItem,     () => { setSelectedDetailItem(null); setNameEditMode(false); },                      'detail');
          useBackClose(!!selectedIngData,        () => setSelectedIngData(null),                                                     'ingredient');
          useBackClose(pickerStep !== null,      closePicker,                                                                        'picker');
          useBackClose(editHistoryId !== null,   closeEditHistory,                                                                   'editHistory');
          useBackClose(editPickerStep !== null,  () => setEditPickerStep(null),                                                      'editPicker');
          useBackClose(reportHistoryId !== null, () => { setReportHistoryId(null); setIsGeneratingReport(false); },                   'report');
          useBackClose(!!backupRestorePreview,   () => setBackupRestorePreview(null),                                                'backup');
          useBackClose(!!detailStepEdit,         () => setDetailStepEdit(null),                                                      'detailStepEdit');
          useBackClose(nameEditMode,             () => setNameEditMode(false),                                                       'nameEdit');
          useBackClose(isQuickAiModalOpen,       closeQuickAiModal,                                                                  'quickAi');
          useBackClose(!!deleteConfirmItem,      () => setDeleteConfirmItem(null),                                                   'deleteConfirm');
          useBackClose(!!reanalyzeTargetId,      () => setReanalyzeTargetId(null),                                                   'reanalyze');
          useBackClose(!!regenConfirmId,         () => setRegenConfirmId(null),                                                      'regenConfirm');
          // [v8] 루틴 기록 삭제 확인 모달 + 루틴 기록 휴지통 모달
          useBackClose(!!deleteHistoryConfirm,   () => setDeleteHistoryConfirm(null),                                                'deleteHistoryConfirm');
          useBackClose(isHistoryTrashModalOpen,  () => setIsHistoryTrashModalOpen(false),                                            'historyTrash');

          // 탭 전환 뒤로가기 처리
          // - simulator(기본 탭)에서는 sentinel 없음 → 뒤로가기 시 앱 종료(정상)
          // - 비기본 탭(tracker/inventory)일 때만 하나의 sentinel 유지
          // - 탭 간 이동은 replaceState로 race 회피 (back() + pushState 충돌 방지)
          useEffect(() => {
            if (activeTab === 'simulator') {
              // 기본 탭 복귀: stale tab sentinel이 있으면 제거
              if (window.history.state && window.history.state.__sktab) {
                window.history.back();
              }
              return;
            }
            // 비기본 탭
            if (window.history.state && window.history.state.__sktab) {
              window.history.replaceState({ __sktab: activeTab }, '');
            } else {
              window.history.pushState({ __sktab: activeTab }, '');
            }
            const onPop = (e) => {
              if (!e.state || !e.state.__sktab) {
                // tab sentinel이 더 이상 없음 → 기본 탭으로 복귀
                setActiveTab('simulator');
              }
            };
            window.addEventListener('popstate', onPop);
            return () => window.removeEventListener('popstate', onPop);
          }, [activeTab]);

          if (isLoadingDb) {
              return <div className="min-h-screen bg-slate-900 flex items-center justify-center text-yellow-400"><Loader2 className="w-10 h-10 animate-spin" /></div>;
          }

          if (!user) {
              return (
                  <div className="min-h-screen bg-slate-900 flex flex-col items-center justify-center p-6 text-white animate-in fade-in">
                      <Bot className="w-20 h-20 text-yellow-400 mb-6 drop-shadow-lg" />
                      <h1 className="text-3xl font-black mb-2 tracking-tight">나만의 AI 스킨케어</h1>
                      <p className="text-slate-400 mb-10 text-center font-medium leading-relaxed">클라우드 동기화와 자가 학습 엔진이 탑재된<br/>스마트 뷰티 비서입니다.</p>
                      <button onClick={window.fbSignIn} className="bg-white text-slate-900 font-bold py-4 px-8 rounded-2xl shadow-xl flex items-center gap-3 hover:bg-gray-100 transition active:scale-95">
                          <img src="https://www.svgrepo.com/show/475656/google-color.svg" className="w-5 h-5" alt="google" />
                          Google 계정으로 안전하게 시작
                      </button>
                  </div>
              );
          }

          return (
            <div className="min-h-screen bg-gray-50 font-sans text-gray-800 pb-20 relative">
              <header className="bg-slate-900 text-white p-6 shadow-md">
                <div className="max-w-3xl mx-auto flex items-center justify-between">
                  <div className="flex-1 w-full">
                    <div className="flex items-center justify-between w-full">
                      <h1 className="text-2xl font-bold flex items-center gap-2 flex-shrink-0">
                        <Bot className="w-7 h-7 text-yellow-500" /> 스킨케어 시스템
                      </h1>
                      <button 
                        onClick={openProfileModal}
                        className="flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-lg text-xs font-bold transition border border-slate-700 whitespace-nowrap flex-shrink-0 text-gray-300"
                      >
                        <UserCircle className="w-4 h-4 text-yellow-400" /> 내 정보
                      </button>
                    </div>
                    <p className="text-sm text-slate-400 mt-2">{userProfile.nickname}님 맞춤형 초정밀 개인화 엔진 가동 중</p>
                  </div>
                </div>
              </header>

              <div className="max-w-3xl mx-auto mt-6 px-4">
                <div className="flex bg-white rounded-xl shadow-sm p-1 border border-gray-100 overflow-x-auto hide-scrollbar">
                  <button className={`flex-1 py-3 px-4 text-sm font-bold rounded-lg transition whitespace-nowrap ${activeTab === 'simulator' ? 'bg-slate-900 text-yellow-400 shadow' : 'text-gray-500 hover:bg-gray-50'}`} onClick={() => setActiveTab('simulator')}>루틴 시뮬레이터</button>
                  <button className={`flex-1 py-3 px-4 text-sm font-bold rounded-lg transition whitespace-nowrap ${activeTab === 'tracker' ? 'bg-slate-900 text-yellow-400 shadow' : 'text-gray-500 hover:bg-gray-50'}`} onClick={() => setActiveTab('tracker')}>트래커 & 추천</button>
                  <button className={`flex-1 py-3 px-4 text-sm font-bold rounded-lg transition whitespace-nowrap ${activeTab === 'inventory' ? 'bg-slate-900 text-yellow-400 shadow' : 'text-gray-500 hover:bg-gray-50'}`} onClick={() => setActiveTab('inventory')}>인벤토리</button>
                </div>

                    <div className="p-5 border-b border-gray-100 flex items-center justify-between flex-shrink-0 bg-slate-900 text-white">
                      <div>
                        <div className="text-xs font-bold text-yellow-400 flex items-center gap-1"><Trash2 className="w-3 h-3" /> 휴지통</div>
                        <div className="text-lg font-bold">{trash.length}개 · 7일 후 자동 삭제</div>
                      </div>
                      <button onClick={() => setIsTrashModalOpen(false)} className="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-full"><X className="w-5 h-5" /></button>
                    </div>

                    <div className="flex-1 overflow-y-auto hide-scrollbar p-4 bg-gray-50">
                      {trash.length === 0 ? (
                        <div className="text-center py-16 text-sm text-gray-400 italic">휴지통이 비어있습니다.</div>
                      ) : (
                        <div className="space-y-2">
                          {trash.map(item => {
                            const daysLeft = getDaysLeft(item.deletedAt);
                            const urgent = daysLeft <= 2;
                            return (
                              <div key={item.id} className="p-3 bg-white border border-gray-200 rounded-xl">
                                <div className="flex items-start justify-between gap-2 mb-2">
                                  <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-1.5 flex-wrap mb-1">
                                      <span className="text-[10px] font-bold text-yellow-700 bg-yellow-100 px-1.5 py-0.5 rounded">{item.brand}</span>
                                      <span className="text-[10px] font-bold text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded">Step {item.step}</span>
                                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${urgent ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                                        {daysLeft === 0 ? '오늘 삭제' : `${daysLeft}일 남음`}
                                      </span>
                                    </div>
                                    <div className="text-sm font-bold text-slate-800 truncate">{item.name}</div>
                                  </div>
                                </div>
                                <div className="flex gap-2">
                                  <button onClick={() => restoreFromTrash(item.id)} className="flex-1 bg-indigo-500 text-white font-bold text-xs py-2 rounded-lg hover:bg-indigo-600 transition flex items-center justify-center gap-1">
                                    <RefreshCw className="w-3 h-3" /> 복원
                                  </button>
                                  <button onClick={() => purgeFromTrash(item.id)} className="flex-1 bg-gray-100 text-gray-600 font-bold text-xs py-2 rounded-lg hover:bg-gray-200 transition flex items-center justify-center gap-1">
                                    <Trash2 className="w-3 h-3" /> 영구 삭제
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {trash.length > 0 && (
                      <div className="p-4 border-t border-gray-100 flex-shrink-0 bg-white">
                        <button onClick={emptyTrash} className="w-full bg-red-500 text-white font-bold py-3 rounded-xl hover:bg-red-600 transition flex items-center justify-center gap-2">
                          <Trash2 className="w-4 h-4" /> 휴지통 비우기
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* [v8] 루틴 기록 삭제 확인 모달 */}
              {deleteHistoryConfirm && (() => {
                const h = deleteHistoryConfirm;
                const tag = getRoutineCareType(h.routine);
                return (
                  <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[95] p-4" onClick={() => setDeleteHistoryConfirm(null)}>
                    <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                      <div className="flex items-center justify-center mb-4">
                        <div className="w-14 h-14 bg-red-100 text-red-600 rounded-full flex items-center justify-center">
                          <Trash2 className="w-7 h-7" />
                        </div>
                      </div>
                      <h3 className="text-lg font-bold text-center text-slate-800 mb-2">루틴 기록을 삭제할까요?</h3>
                      <div className="bg-gray-50 border border-gray-200 p-3 rounded-xl mb-4">
                        <div className="flex items-center gap-2 flex-wrap mb-1">
                          <span className="font-bold text-slate-700 text-sm">{h.date}</span>
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded ${h.timeOfDay === 'day' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>{h.timeOfDay === 'day' ? '☀️ 낮' : '🌙 밤'}</span>
                          <span className={`text-[11px] font-bold px-2 py-0.5 rounded ${tag.color}`}>{tag.label}</span>
                          <span className="text-[11px] font-bold text-green-600 bg-green-100 px-2 py-0.5 rounded">{h.score}점</span>
                        </div>
                      </div>
                      <div className="bg-indigo-50 border border-indigo-200 p-3 rounded-xl text-[11px] text-indigo-800 leading-relaxed mb-5">
                        💡 삭제된 기록은 <strong>휴지통으로 이동</strong>되며, <strong>7일 후 자동으로 영구 삭제</strong>됩니다. 그 전에는 언제든지 복원할 수 있습니다.
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setDeleteHistoryConfirm(null)} className="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200 transition">아니오</button>
                        <button onClick={confirmDeleteHistoryItem} className="flex-1 bg-red-500 text-white font-bold py-3 rounded-xl hover:bg-red-600 transition">예, 삭제</button>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* [v8] 루틴 기록 휴지통 모달 */}
              {isHistoryTrashModalOpen && (
                <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-end sm:items-center justify-center z-[65] p-0 sm:p-4" onClick={() => setIsHistoryTrashModalOpen(false)}>
                  <div className="bg-white w-full sm:max-w-md h-full sm:h-auto sm:max-h-[85vh] sm:rounded-3xl overflow-hidden flex flex-col shadow-2xl animate-in fade-in duration-200" onClick={e => e.stopPropagation()}>
                    <div className="p-5 border-b border-gray-100 flex items-center justify-between flex-shrink-0 bg-slate-900 text-white">
                      <div>
                        <div className="text-xs font-bold text-yellow-400 flex items-center gap-1"><TrashOpen className="w-3 h-3" /> 루틴 기록 휴지통</div>
                        <div className="text-lg font-bold">{historyTrash.length}개 · 7일 후 자동 삭제</div>
                      </div>
                      <button onClick={() => setIsHistoryTrashModalOpen(false)} className="bg-slate-700 hover:bg-slate-600 text-white p-2 rounded-full"><X className="w-5 h-5" /></button>
                    </div>

                    <div className="flex-1 overflow-y-auto hide-scrollbar p-4 bg-gray-50">
                      {historyTrash.length === 0 ? (
                        <div className="text-center py-16 text-sm text-gray-400 italic">휴지통이 비어있습니다.</div>
                      ) : (
                        <div className="space-y-2">
                          {historyTrash.map(item => {
                            const daysLeft = getDaysLeft(item.deletedAt);
                            const urgent = daysLeft <= 2;
                            const tag = getRoutineCareType(item.routine);
                            const r = normalizeRoutine(item.routine);
                            return (
                              <div key={item.id} className="p-3 bg-white border border-gray-200 rounded-xl">
                                <div className="flex items-start justify-between gap-2 mb-2">
                                  <div className="flex-1 min-w-0">
                                    <div className="flex items-center gap-1.5 flex-wrap mb-1.5">
                                      <span className="text-[10px] font-bold text-slate-700 bg-slate-100 px-1.5 py-0.5 rounded">{item.date}</span>
                                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${item.timeOfDay === 'day' ? 'bg-blue-100 text-blue-700' : 'bg-purple-100 text-purple-700'}`}>{item.timeOfDay === 'day' ? '☀️ 낮' : '🌙 밤'}</span>
                                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${tag.color}`}>{tag.label}</span>
                                      <span className="text-[10px] font-bold text-green-700 bg-green-100 px-1.5 py-0.5 rounded">{item.score}점</span>
                                      <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded ${urgent ? 'bg-red-100 text-red-700' : 'bg-blue-100 text-blue-700'}`}>
                                        {daysLeft === 0 ? '오늘 삭제' : `${daysLeft}일 남음`}
                                      </span>
                                    </div>
                                    <div className="text-[11px] text-slate-600 space-y-0.5">
                                      {[1,2,3,4,5,6,7].map(s => {
                                        const names = (r[s] || []).map(id => inventory.find(i => i.id === id)?.name).filter(Boolean);
                                        if (names.length === 0) return null;
                                        return (
                                          <div key={`ht-${item.id}-s${s}`} className="truncate">
                                            <span className="font-bold text-gray-400">S{s}</span> {names.join(' + ')}
                                          </div>
                                        );
                                      })}
                                    </div>
                                  </div>
                                </div>
                                <div className="flex gap-2">
                                  <button onClick={() => restoreHistoryFromTrash(item.id)} className="flex-1 bg-indigo-500 text-white font-bold text-xs py-2 rounded-lg hover:bg-indigo-600 transition flex items-center justify-center gap-1">
                                    <RefreshCw className="w-3 h-3" /> 복원
                                  </button>
                                  <button onClick={() => purgeHistoryFromTrash(item.id)} className="flex-1 bg-gray-100 text-gray-600 font-bold text-xs py-2 rounded-lg hover:bg-gray-200 transition flex items-center justify-center gap-1">
                                    <Trash2 className="w-3 h-3" /> 영구 삭제
                                  </button>
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>

                    {historyTrash.length > 0 && (
                      <div className="p-4 border-t border-gray-100 flex-shrink-0 bg-white">
                        <button onClick={emptyHistoryTrash} className="w-full bg-red-500 text-white font-bold py-3 rounded-xl hover:bg-red-600 transition flex items-center justify-center gap-2">
                          <Trash2 className="w-4 h-4" /> 휴지통 비우기
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}

              {/* [v6] 리포트 재생성 확인 모달 */}
              {regenConfirmId && (() => {
                const h = history.find(x => x.id === regenConfirmId);
                if (!h) return null;
                return (
                  <div className="fixed inset-0 bg-slate-900/70 backdrop-blur-sm flex items-center justify-center z-[100] p-4" onClick={() => setRegenConfirmId(null)}>
                    <div className="bg-white rounded-3xl w-full max-w-sm p-6 shadow-2xl animate-in zoom-in-95 duration-200" onClick={e => e.stopPropagation()}>
                      <div className="flex items-center justify-center mb-4">
                        <div className="w-14 h-14 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center">
                          <RefreshCw className="w-7 h-7" />
                        </div>
                      </div>
                      <h3 className="text-lg font-bold text-center text-slate-800 mb-2">리포트를 재생성할까요?</h3>
                      <p className="text-sm text-gray-600 text-center mb-4">{h.date} · {h.timeOfDay === 'day' ? '낮' : '밤'} 루틴</p>
                      <div className="bg-red-50 border border-red-200 p-3 rounded-xl text-[11px] text-red-800 leading-relaxed mb-2">
                        ⚠️ 기존에 생성된 리포트가 있습니다. 재생성 시 <strong>이전 리포트는 새 결과로 덮어씌워집니다</strong>.
                      </div>
                      <div className="bg-amber-50 border border-amber-200 p-3 rounded-xl text-[11px] text-amber-800 leading-relaxed mb-5">
                        📅 메커니즘 리포트의 <strong>저장기한은 7일</strong>입니다. 7일 경과 시 자동 삭제되며, 루틴 기록 자체는 유지됩니다.
                      </div>
                      <div className="flex gap-2">
                        <button onClick={() => setRegenConfirmId(null)} className="flex-1 bg-gray-100 text-gray-600 font-bold py-3 rounded-xl hover:bg-gray-200 transition">취소</button>
                        <button onClick={() => generateMechanismReport(h)} className="flex-1 bg-amber-500 text-white font-bold py-3 rounded-xl hover:bg-amber-600 transition">재생성</button>
                      </div>
                    </div>
                  </div>
                );
              })()}

              {/* [v6] 메커니즘 분석 리포트 모달 */}
              {reportHistoryId && (() => {
                const h = history.find(x => x.id === reportHistoryId);
                if (!h) return null;
                const report = h.mechanismReport;
                const timeLabel = h.timeOfDay === 'day' ? '☀️ 낮' : '🌙 밤';

                return (
                  <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center z-[90] p-0 sm:p-4" onClick={() => setReportHistoryId(null)}>
                    <div className="bg-slate-50 w-full sm:max-w-2xl h-full sm:h-auto sm:max-h-[92vh] sm:rounded-2xl overflow-hidden flex flex-col shadow-2xl animate-in fade-in duration-200" onClick={e => e.stopPropagation()}>
                      {/* 헤더 바 */}
                      <div className="p-4 border-b border-gray-200 flex items-center justify-between flex-shrink-0 bg-white">
                        <div>
                          <div className="text-[10px] font-bold text-amber-600 tracking-widest">MECHANISM REPORT</div>
                          <div className="text-sm font-bold text-slate-800">{h.date} · {timeLabel}</div>
                        </div>
                        <div className="flex gap-1">
                          {report && (
                            <button
                              onClick={() => setRegenConfirmId(h.id)}
                              className="p-2 text-gray-400 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"
                              title="리포트 재생성"
                            >
                              <RefreshCw className="w-4 h-4" />
                            </button>
                          )}
                          <button onClick={() => setReportHistoryId(null)} className="bg-gray-100 hover:bg-gray-200 text-gray-600 p-2 rounded-full"><X className="w-5 h-5" /></button>
                        </div>
                      </div>

                      {/* 본문 */}
                      <div className="flex-1 overflow-y-auto hide-scrollbar p-5 sm:p-8">
                        {isGeneratingReport || !report ? (
                          <div className="flex flex-col items-center justify-center py-20">
                            <Loader2 className="w-12 h-12 animate-spin text-amber-500 mb-4" />
                            <h3 className="text-base font-bold text-slate-800 mb-1">AI가 메커니즘 분석 중입니다</h3>
                            <p className="text-xs text-gray-500 text-center leading-relaxed mb-4">각 제품의 작용 원리를 단계별로 분석하고 있습니다...</p>
                            <div className="bg-amber-50 border border-amber-200 px-4 py-2 rounded-full text-[11px] text-amber-800 font-medium">
                              📅 생성된 리포트의 저장기한은 <strong>7일</strong>입니다
                            </div>
                          </div>
                        ) : (
                          <div className="bg-white rounded-2xl p-6 sm:p-8 shadow-sm" style={{ borderTop: '6px solid #1a252f' }}>
                            {/* 리포트 헤더 */}
                            <div className="text-center mb-8">
                              <span className="inline-block bg-slate-800 text-white text-[11px] font-bold px-3 py-1 rounded-full tracking-widest">{report.subBadge}</span>
                              <div className="text-xl sm:text-2xl font-black text-slate-900 mt-3 leading-tight whitespace-pre-line">{report.title}</div>
                            </div>

                            {/* 타임라인 */}
                            <div className="relative py-4">
                              <div className="absolute top-0 bottom-0 w-0.5 bg-gray-200" style={{ left: '23px' }}></div>
                              {report.steps.map((s, idx) => (
                                <div key={idx} className="relative mb-6 last:mb-0" style={{ paddingLeft: '60px' }}>
                                  <div className="absolute left-0 top-0 w-12 h-12 bg-slate-900 text-white rounded-full flex items-center justify-center font-bold text-xs shadow-lg border-4 border-white z-10">
                                    {s.stepIcon}
                                  </div>
                                  <div className="bg-white border border-gray-200 rounded-xl shadow-sm overflow-hidden">
                                    {/* 제품 헤더 */}
                                    <div className="px-4 pt-3 pb-3">
                                      <div className="text-[10px] text-gray-500 font-bold uppercase tracking-wider mb-1">{s.brandLine}</div>
                                      <div className="text-base font-bold text-slate-800 leading-snug">{s.productName}</div>
                                    </div>

                                    {/* 구분선 */}
                                    <div className="h-px bg-gray-200 mx-4"></div>

                                    {/* 메커니즘 영역 (전체폭 + 좌측 액센트 바) */}
                                    <div className="bg-slate-50 border-l-4 border-blue-400 px-4 py-3">
                                      <div className="text-[13px] font-bold text-blue-600 mb-2">{s.mechanismTitle}</div>
                                      <div className="text-sm text-slate-700 leading-relaxed report-mechanism-body" dangerouslySetInnerHTML={{ __html: s.mechanismBody }}></div>
                                    </div>

                                    {/* 결과 라인 */}
                                    <div className="px-4 py-2.5 bg-orange-50 border-t border-orange-100 text-xs text-orange-700 font-bold flex items-start gap-1.5">
                                      <CheckCircle className="w-3 h-3 mt-0.5 flex-shrink-0" />
                                      <span>{s.resultText}</span>
                                    </div>
                                  </div>
                                </div>
                              ))}
                            </div>

                            {/* 종합 평가 */}
                            <div className="mt-8 p-5 rounded-xl text-white report-conclusion" style={{ background: 'linear-gradient(135deg, #2c3e50, #34495e)' }}>
                              <div className="text-base font-bold text-yellow-400 mb-3">{report.conclusionTitle}</div>
                              <div className="text-sm leading-relaxed text-gray-100 report-conclusion-body" dangerouslySetInnerHTML={{ __html: report.conclusionText }}></div>
                            </div>

                            {/* 개선 권장사항 (있을 때만) */}
                            {report.improvements && report.improvements.trim() && (
                              <div className="mt-4 p-5 rounded-xl bg-red-50 border-2 border-red-200 report-improvements">
                                <div className="text-sm leading-relaxed text-red-900" dangerouslySetInnerHTML={{ __html: report.improvements }}></div>
                              </div>
                            )}

                            {/* 생성 시간 + 저장기한 (7일) */}
                            {report.generatedAt && (() => {
                              const ageMs = Date.now() - new Date(report.generatedAt).getTime();
                              const daysLeft = Math.max(0, 7 - Math.floor(ageMs / (24 * 60 * 60 * 1000)));
                              const urgent = daysLeft <= 2;
                              return (
                                <div className="text-center mt-5 space-y-1.5">
                                  <div className="text-[10px] text-gray-400">
                                    생성: {new Date(report.generatedAt).toLocaleString('ko-KR')}
                                  </div>
                                  <div className={`inline-block text-[10px] px-3 py-1 rounded-full font-medium ${urgent ? 'bg-red-50 text-red-600 border border-red-200' : 'bg-amber-50 text-amber-700 border border-amber-200'}`}>
                                    📅 저장기한 7일 · <strong>{daysLeft}일 남음</strong>
                                  </div>
                                </div>
                              );
                            })()}
                          </div>
                        )}
                      </div>
                    </div>
                  </div>
                );
              })()}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
